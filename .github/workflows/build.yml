# Builds the mod on every push. Pushing a tag like v0.2.0 also publishes a GitHub release with the jar attached.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -x test --stacktrace
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: retroeras
          path: build/libs/retroeras-*.jar
          if-no-files-found: error
      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/retroeras-*.jar | grep -v -- -sources.jar)
          gh release create "$GITHUB_REF_NAME" "$jar" --title "Retro Eras ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
